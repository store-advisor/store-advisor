version: 2

# Grouped weekly updates. Grouping matters: an ungrouped Dependabot on a
# monorepo opens a dozen PRs a week and the team learns to ignore all of them.
updates:
  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      nestjs:
        patterns: ['@nestjs/*']
      prisma:
        patterns: ['prisma', '@prisma/*']
      dev-tooling:
        dependency-type: development
    ignore:
      # ts-jest 29 declares peer `typescript >=4.3 <7`, so TypeScript 7 fails
      # `npm ci` with ERESOLVE before a single test runs. Held back rather
      # than forced: --legacy-peer-deps would install a combination ts-jest
      # does not support and move the breakage from CI into the test runner.
      #
      # This blocks only the major. Patches and minors on the 5.x line still
      # come through, and the whole dev-tooling group was stuck behind this
      # one package.
      #
      # Remove when a ts-jest release accepts TypeScript 7: check the peer
      # range with `npm view ts-jest peerDependencies`.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']

      # NestJS 12 ships as pure ESM. Jest here runs CommonJS through ts-jest,
      # so every suite that imports @nestjs/common dies at collection with
      # "Must use import to load ES Module" — 10 of 11 suites, before any
      # assertion. Verified on Node 26 as well as 22, so this is not the
      # `require(esm)` version gate Jest points at; the CommonJS transform is.
      #
      # Taking Nest 12 means migrating the test setup to ESM. That is a piece
      # of work with its own PR, not a version bump, and it drags TypeScript 6
      # in with it: @nestjs/schematics@12 peers `typescript >=6.0.0`, and TS 6
      # additionally wants an explicit `rootDir`, `ignoreDeprecations` for
      # `baseUrl`, and definite-assignment assertions on all 14 Swagger DTO
      # properties. All of that was measured, none of it is speculative.
      #
      # Held at the major only: 11.x patches and minors still come through,
      # and without this the whole dev-tooling group stays red.
      #
      # Remove together with the ESM migration, not before.
      - dependency-name: '@nestjs/*'
        update-types: ['version-update:semver-major']

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      next:
        patterns: ['next', 'react', 'react-dom', 'eslint-config-next']
      dev-tooling:
        dependency-type: development
    ignore:
      # Same wall as /backend: web carries its own ts-jest 29, which peers
      # `typescript >=4.3 <7`, so TypeScript 7 fails `npm ci` with ERESOLVE
      # and takes the whole web dev-tooling group down with it.
      #
      # The hold added for /backend did not cover this directory — each
      # ecosystem block carries its own ignore list — so the web group stayed
      # red after the backend one was fixed.
      #
      # Lift both together when a ts-jest release accepts TypeScript 7:
      # `npm view ts-jest peerDependencies`.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']

      # ESLint 10 changed the rule context API: rules now receive a context
      # object where `getFilename()` used to live on the second argument.
      # eslint-plugin-react has not adopted it, and it arrives here bundled
      # inside eslint-config-next, so it is not ours to upgrade. `npm run
      # lint` dies before linting a single file:
      #
      #   TypeError: Error while loading rule 'react/display-name':
      #   contextOrFilename.getFilename is not a function
      #
      # /backend deliberately does NOT hold eslint: it lints with
      # typescript-eslint and took 10.x without complaint. This is a
      # web-only incompatibility, so the hold is web-only too.
      #
      # Lift when eslint-config-next ships an eslint-plugin-react that
      # supports ESLint 10.
      - dependency-name: eslint
        update-types: ['version-update:semver-major']

  - package-ecosystem: pip
    directory: /ai
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday

  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
      day: monday
