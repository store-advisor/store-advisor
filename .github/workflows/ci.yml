name: CI

on:
  pull_request:
  push:
    branches:
      - main

# A new push to the same branch makes the previous run irrelevant. Without
# this, superseded runs keep burning minutes and the checks list shows stale
# results.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-files:
    name: Detect services
    runs-on: ubuntu-latest
    outputs:
      backend_exists: ${{ steps.check.outputs.backend_exists }}
      ai_exists: ${{ steps.check.outputs.ai_exists }}
      web_exists: ${{ steps.check.outputs.web_exists }}
    steps:
      - uses: actions/checkout@v7
      - id: check
        run: |
          {
            echo "backend_exists=${{ hashFiles('backend/package.json') != '' }}"
            echo "ai_exists=${{ hashFiles('ai/requirements.txt') != '' }}"
            echo "web_exists=${{ hashFiles('web/package.json') != '' }}"
          } >> "$GITHUB_OUTPUT"

  backend:
    name: Backend
    runs-on: ubuntu-latest
    needs: check-files
    if: needs.check-files.outputs.backend_exists == 'true'
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: storeadvisor
          POSTGRES_PASSWORD: localdev
          POSTGRES_DB: storeadvisor_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U storeadvisor -d storeadvisor_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgres://storeadvisor:localdev@localhost:5432/storeadvisor_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy

      # Catches a schema.prisma edited without a matching migration. Prisma
      # replays the migrations directory into a scratch database and compares
      # the result to the datamodel, so the shadow database must already
      # exist - it will not create one.
      - name: Create shadow database
        run: |
          PGPASSWORD=localdev psql -h localhost -U storeadvisor \
            -d storeadvisor_test \
            -c 'CREATE DATABASE storeadvisor_shadow;'

      - name: Check for migration drift
        env:
          SHADOW_DATABASE_URL: postgres://storeadvisor:localdev@localhost:5432/storeadvisor_shadow
        run: |
          set +e
          npx prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema prisma/schema.prisma \
            --exit-code
          status=$?
          set -e
          # --exit-code contract: 0 = no diff, 2 = diff found, 1 = the command
          # itself failed. Collapsing 1 and 2 would report a broken CI step as
          # a schema problem and send someone hunting the wrong thing.
          case "$status" in
            0) echo "No drift: migrations match schema.prisma." ;;
            2) echo "::error::schema.prisma has changes with no corresponding migration. Run: npx prisma migrate dev --name <describe-the-change>"
               exit 1 ;;
            *) echo "::error::prisma migrate diff failed with status $status."
               exit 1 ;;
          esac

      # `lint` deliberately has no --fix. With it, eslint repaired the code in
      # the runner, exited 0, and threw the repair away — so this step passed
      # on code that does not pass lint, and main accumulated nine errors
      # nobody saw. Use `npm run lint:fix` locally; CI only reports.
      - run: npm run lint
      - run: npm run build

      # Runs every *.spec.ts under src/, which includes the integration specs
      # that exercise real HTTP against the Postgres service above.
      #
      # `npm run test:e2e` is deliberately NOT run here. Its only test asserts
      # that the unmodified Nest scaffold serves "Hello World!" at /, which
      # gates nothing and would make deleting that scaffold a CI failure. The
      # HTTP-level coverage that matters already lives in the *.integration
      # .spec.ts files this step runs. If real end-to-end tests are ever
      # written, wire the suite in then — and delete the scaffold test first.
      - run: npm test

  # The gap that let two defects sit on main for weeks: the unit suite passes
  # against a dev install, so nothing noticed that `docker build` failed and
  # that the container exited on boot. This job builds the artefact we would
  # actually deploy and proves it serves traffic.
  image:
    name: Image builds and boots
    runs-on: ubuntu-latest
    needs: check-files
    if: needs.check-files.outputs.backend_exists == 'true'
    steps:
      - uses: actions/checkout@v7

      - name: Build and start the stack
        run: docker compose up -d --build

      - name: Wait for the API to serve /health
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/health | grep -q '"status":"ok"'; then
              echo "API healthy after ${i}s."
              exit 0
            fi
            sleep 1
          done
          echo "::error::API did not serve /health within 30s."
          exit 1

      - name: Verify the contract is reachable
        run: |
          # 401 without auth is the contract; a 404 here means routing broke.
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            'http://localhost:3000/findings?merchant_id=smoke')
          echo "GET /findings without auth -> $code"
          [ "$code" = "401" ] || { echo "::error::expected 401, got $code"; exit 1; }

      # Same reasoning as the API check above, for the service added in stage
      # 3: nothing else in CI builds ai/Dockerfile, so without this a broken
      # image would first be discovered at deploy time.
      #
      # No API key here, and none needed. The container must boot and serve
      # /health regardless — it only needs credentials to answer /api/explain,
      # and failing to start without them would take the whole stack down over
      # an optional enrichment.
      - name: Wait for the AI service to serve /health
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8000/health | grep -q '"status":"ok"'; then
              echo "AI service healthy after ${i}s."
              exit 0
            fi
            sleep 1
          done
          echo "::error::AI service did not serve /health within 60s."
          exit 1

      # Always: when the smoke test fails, the container logs are the only
      # thing that explains why, and a failed step would otherwise skip this.
      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v

  ai:
    name: AI service
    runs-on: ubuntu-latest
    needs: check-files
    if: needs.check-files.outputs.ai_exists == 'true'
    defaults:
      run:
        working-directory: ai
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ai/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest

  web:
    name: Web
    runs-on: ubuntu-latest
    needs: check-files
    if: needs.check-files.outputs.web_exists == 'true'
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      # The dashboard shipped with a jest config and three suites that this
      # job never ran. Under the merge policy in HANDBOOK.md section 8, green
      # CI is what authorises a merge — so a test suite CI does not run is a
      # test suite that does not exist.
      - run: npm test
