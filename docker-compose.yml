services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-storeadvisor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-localdev}
      POSTGRES_DB: ${POSTGRES_DB:-storeadvisor}
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U storeadvisor']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5
    # No volume: Redis here is only a BullMQ queue backend, not a data
    # store. Losing queued jobs on a dev restart is acceptable — and
    # avoids replaying stale jobs after every restart.

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
      # Targets the `build` stage specifically — it has the Prisma CLI
      # (a devDependency), which the slim `runtime` stage deliberately
      # excludes.
      target: build
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://storeadvisor:localdev@postgres:5432/storeadvisor}
    depends_on:
      postgres:
        condition: service_healthy
    command: npx prisma migrate deploy
    # One-shot: applies pending migrations, then exits. Not a long-running
    # service — run with `docker compose run --rm migrate`, or as a
    # dependency gate for api/worker below.

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runtime
    ports:
      - '${API_PORT:-3000}:3000'
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://storeadvisor:localdev@postgres:5432/storeadvisor}
      REDIS_URL: redis://redis:6379
      AI_SERVICE_URL: http://ai:8000
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      # Deliberately NOT depends_on: ai. Explanations are an enrichment, not a
      # prerequisite — the API serves findings and the check engine detects
      # them whether or not the AI service is up. Gating the API on it would
      # invent a dependency the code does not have.

  ai:
    build: ./ai
    ports:
      - '${AI_PORT:-8000}:8000'
    environment:
      # The only secret this service needs. Without it the container still
      # starts and serves /health — it answers 503 with an actionable message
      # on /api/explain, which is a far better failure than refusing to boot.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-opus-5}
    # No DATABASE_URL, and that is the point. The AI service never reads the
    # database: it is handed the evidence a check already proved and returns
    # prose. Giving it a connection string would invite exactly the coupling
    # the golden rule exists to prevent.

  # Uncomment as each service gets built.
  #
  # worker:
  #   build: ./backend
  #   command: npm run start:worker
  #   environment:
  #     DATABASE_URL: ${DATABASE_URL:-postgresql://storeadvisor:localdev@postgres:5432/storeadvisor}
  #     REDIS_URL: redis://redis:6379
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #     migrate:
  #       condition: service_completed_successfully

volumes:
  pgdata:
