services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-storeadvisor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-localdev}
      POSTGRES_DB: ${POSTGRES_DB:-storeadvisor}
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U storeadvisor']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5
    # No volume: Redis here is only a BullMQ queue backend, not a data
    # store. Losing queued jobs on a dev restart is acceptable — and
    # avoids replaying stale jobs after every restart.

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
      # Targets the `build` stage specifically — it has the Prisma CLI
      # (a devDependency), which the slim `runtime` stage deliberately
      # excludes.
      target: build
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://storeadvisor:localdev@postgres:5432/storeadvisor}
    depends_on:
      postgres:
        condition: service_healthy
    command: npx prisma migrate deploy
    # One-shot: applies pending migrations, then exits. Not a long-running
    # service — run with `docker compose run --rm migrate`, or as a
    # dependency gate for api/worker below.

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runtime
    ports:
      - '${API_PORT:-3000}:3000'
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://storeadvisor:localdev@postgres:5432/storeadvisor}
      REDIS_URL: redis://redis:6379
      AI_SERVICE_URL: http://ai:8000
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      # Deliberately NOT depends_on: ai. Explanations are an enrichment, not a
      # prerequisite — the API serves findings and the check engine detects
      # them whether or not the AI service is up. Gating the API on it would
      # invent a dependency the code does not have.

  ai:
    build: ./ai
    ports:
      - '${AI_PORT:-8000}:8000'
    environment:
      # The only secret this service needs. Without it the container still
      # starts and serves /health — it answers 503 with an actionable message
      # on /api/explain, which is a far better failure than refusing to boot.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-opus-5}
    # No DATABASE_URL, and that is the point. The AI service never reads the
    # database: it is handed the evidence a check already proved and returns
    # prose. Giving it a connection string would invite exactly the coupling
    # the golden rule exists to prevent.

  # The half of the system that speaks first. Same image as the API, a
  # different entry point: this process serves no HTTP, registers the hourly
  # sweep, and consumes the per-merchant check jobs it fans out.
  #
  # A separate service rather than a thread inside `api` on purpose. A check
  # run competing with request handling for one event loop makes both slower
  # and harder to reason about, and scaling the API for traffic would
  # otherwise silently scale the number of check workers with it.
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runtime
    command: npm run start:worker:prod
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://storeadvisor:localdev@postgres:5432/storeadvisor}
      REDIS_URL: redis://redis:6379
      AI_SERVICE_URL: http://ai:8000
      # Hourly, on the hour. Override to something like '*/1 * * * *' when
      # demonstrating, so the schedule fires while someone is watching.
      CHECK_SCHEDULE_CRON: ${CHECK_SCHEDULE_CRON:-0 * * * *}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      # Not gated on `ai`, for the same reason the API is not: an explanation
      # is an enrichment. The worker detects and persists findings whether or
      # not the AI service answers.

  # The dashboard, the cleaning tool and the API docs. The front door: this is
  # the only service a person actually looks at, and until now it was the only
  # one `docker compose up` did not start.
  #
  # Published on 3001 because the API already holds 3000, and the browser talks
  # to both: NEXT_PUBLIC_* values are compiled into the client bundle, so they
  # are build arguments naming host addresses, not container names.
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3000}
        NEXT_PUBLIC_AI_URL: ${NEXT_PUBLIC_AI_URL:-http://localhost:8000}
    ports:
      - '${WEB_PORT:-3001}:3001'
    depends_on:
      # Started after both, but gated on neither being healthy: the dashboard
      # renders its own error state when the API is down, which is a better
      # failure than a container that refuses to start.
      - api
      - ai


volumes:
  pgdata:
