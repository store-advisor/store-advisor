# Overlay for a deployed environment. Apply on top of the base file:
#
#     docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# What it changes, and why each one matters somewhere other than a laptop:
#
#   - Postgres and Redis stop publishing ports to the host. In the base file
#     they are on 5432 and 6379 so you can point a client at them; on a public
#     machine that is two open datastores. Services still reach each other over
#     the compose network, which is the only access they need.
#   - The API and the dashboard stop publishing directly too. Cloudflare Tunnel
#     reaches them over the same network, so the host needs no inbound ports at
#     all and the firewall stays shut.
#   - Passwords come from the environment with no fallback. The base file
#     defaults to `localdev`, which is right for a laptop and wrong here; if
#     POSTGRES_PASSWORD is unset, compose fails loudly instead of starting
#     something guessable.
#   - A cloudflared container terminates the tunnel.
#
# See infra/oracle.md for the machine this is written against.

services:
  postgres:
    ports: !override []
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}

  redis:
    ports: !override []

  # The AI service is the easiest one to forget, because nothing in the browser
  # calls it directly. It has no authentication of its own and allows every
  # origin, so publishing 8000 on a public host puts an unauthenticated
  # /api/clean and an Anthropic-key-backed /api/explain on the internet. The
  # API and the worker reach it over the compose network.
  ai:
    ports: !override []

  migrate:
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}

  api:
    ports: !override []
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}

  worker:
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}

  web:
    ports: !override []

  # Outbound-only connection to Cloudflare. Nothing listens on the host, so the
  # instance's security list and its local iptables can both stay closed, which
  # also sidesteps the Oracle images' habit of shipping restrictive iptables
  # rules that surprise people who only edited the VCN.
  #
  # Access policy, and therefore who can reach the dashboard at all, is
  # configured in Cloudflare rather than here. That matters while the API's auth
  # is a stub: see the P0 in infra/README.md.
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:?set CLOUDFLARE_TUNNEL_TOKEN in .env}
    depends_on:
      - web
      - api
